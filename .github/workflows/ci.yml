name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  OTP_VERSION: "29.1.2"
  ELIXIR_VERSION: "1.20.5-otp-29"
  NERVES_BOOTSTRAP_VERSION: "1.17.4"
  FWUP_VERSION: "1.17.1"
  FWUP_SHA256: "b73ca78effe61e4c8cedcff567ca137b6bdaa1772b84f9e4d88913f192c09bf2"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: libmnl headers, for nerves_uevent on the host
        run: sudo apt-get update && sudo apt-get install -y libmnl-dev
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - run: mix archive.install --force hex nerves_bootstrap ${{ env.NERVES_BOOTSTRAP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-test-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-test-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors --force
      - run: mix test

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MIX_TARGET: nano_kvm_go
      NERVES_FW_VCS_IDENTIFIER: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - run: mix archive.install --force hex nerves_bootstrap ${{ env.NERVES_BOOTSTRAP_VERSION }}
      - name: Install fwup
        run: |
          curl -fsSLo "$RUNNER_TEMP/fwup.deb" "https://github.com/fwup-home/fwup/releases/download/v$FWUP_VERSION/fwup_${FWUP_VERSION}_amd64.deb"
          echo "$FWUP_SHA256  $RUNNER_TEMP/fwup.deb" | sha256sum -c
          sudo apt-get install -y "$RUNNER_TEMP/fwup.deb"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nerves/dl
          key: nerves-dl-${{ hashFiles('mix.lock') }}
          restore-keys: nerves-dl-
      - run: mix deps.get
      - run: mix firmware
      - name: Image
        run: |
          mkdir firmware
          cp _build/nano_kvm_go_dev/nerves/images/kuroneko.fw firmware/
          fwup -a -q -i firmware/kuroneko.fw -t complete -d firmware/kuroneko.img
          gzip -9 firmware/kuroneko.img
          ls -l firmware
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: firmware
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [test, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware
          path: firmware
      - name: Check the version
        run: grep -qF "@version \"${GITHUB_REF_NAME#v}\"" mix.exs
      - name: Release notes from the CHANGELOG
        run: |
          awk -v h="## $GITHUB_REF_NAME" 'index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") {f = 1; next} /^## /{f = 0} f' CHANGELOG.md > notes.md
          # GitHub keeps the line breaks of a release's notes: join wrapped lines
          python3 - notes.md <<'EOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          out = []
          for line in p.read_text().splitlines():
              if line.strip() and out and out[-1].strip() and not line.startswith("* "):
                  out[-1] = out[-1].rstrip() + " " + line.strip()
              else:
                  out.append(line)
          p.write_text("\n".join(out).strip("\n") + "\n")
          EOF
          grep -q . notes.md
          {
            echo
            echo "Burn \`kuroneko.fw\` with [fwup](https://github.com/fwup-home/fwup), or \`kuroneko.img.gz\` with a tool such as balenaEtcher, then see [Trying it](https://github.com/cocoa-xu/kuroneko#trying-it)."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            (cd firmware && sha256sum -- *)
            echo '```'
          } >> notes.md
          cat notes.md
      - name: Release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" firmware/*
          else
            gh release create "$GITHUB_REF_NAME" firmware/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
