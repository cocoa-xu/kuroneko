# What a card can be burned with, without building new firmware: set these in
# the environment of fwup, as in
#
#   NERVES_WIFI_SSID='my network' NERVES_WIFI_PASSPHRASE='passphrase' fwup kuroneko.fw
#
# The '$' is escaped so that the values come when the card is burned: none of
# them is in the .fw file. Kuroneko.Provisioning applies them at boot.

# The Wi-Fi to join while the device has none, or at every boot with
# NERVES_WIFI_FORCE=true, as in Nerves Livebook. Without a passphrase the
# network is open; with one, WPA2 or WPA3.
uboot_setenv(uboot-env, "wifi_ssid", "\${NERVES_WIFI_SSID}")
uboot_setenv(uboot-env, "wifi_passphrase", "\${NERVES_WIFI_PASSPHRASE}")
uboot_setenv(uboot-env, "wifi_force", "\${NERVES_WIFI_FORCE}")

# Public keys that may log in over SSH, one per line, as in authorized_keys.
# They are added at the first boot and then cleared from the card.
uboot_setenv(uboot-env, "ssh_authorized_keys", "\${NERVES_SSH_AUTHORIZED_KEYS}")

# The serial number, which names the device (nerves-<its last 4 characters>);
# empty for the chip's own.
uboot_setenv(uboot-env, "nerves_serial_number", "\${NERVES_SERIAL_NUMBER}")
